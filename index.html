<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rose Flower</title>
</head>

<body>

  <svg
    width="300"
    height="350"
    viewBox="0 0 300 350"
    xmlns="http://www.w3.org/2000/svg"
  >

    <!-- Stem -->
    <path
      d="M150 190 C145 230 155 275 150 330"
      stroke="#2e7d32"
      stroke-width="10"
      fill="none"
      stroke-linecap="round"
    />

    <!-- Left Leaf -->
    <path
      d="M150 260
         C115 235 75 245 65 275
         C95 285 125 280 150 260Z"
      fill="#43a047"
    />

    <!-- Leaf vein -->
    <path
      d="M75 270 C105 270 125 265 150 260"
      stroke="#1b5e20"
      stroke-width="3"
      fill="none"
    />

    <!-- Right Leaf -->
    <path
      d="M150 295
         C180 265 220 265 235 290
         C205 305 175 305 150 295Z"
      fill="#388e3c"
    />

    <!-- Right leaf vein -->
    <path
      d="M150 295 C180 290 205 285 230 285"
      stroke="#1b5e20"
      stroke-width="3"
      fill="none"
    />

    <!-- Rose outer petals -->
    <path
      d="M150 205
         C105 205 75 180 78 140
         C80 105 105 75 135 70
         C120 45 145 25 170 45
         C195 30 220 55 205 80
         C235 95 240 135 220 165
         C205 190 180 205 150 205Z"
      fill="#e91e63"
    />

    <!-- Left petal -->
    <path
      d="M135 70
         C100 70 85 100 95 130
         C105 155 130 165 150 145
         C125 125 120 95 135 70Z"
      fill="#f06292"
    />

    <!-- Right petal -->
    <path
      d="M170 45
         C205 50 225 80 210 110
         C200 130 180 135 160 120
         C180 100 185 70 170 45Z"
      fill="#c2185b"
    />

    <!-- Middle petal -->
    <path
      d="M150 65
         C125 85 125 115 150 140
         C175 120 185 90 150 65Z"
      fill="#ad1457"
    />

    <!-- Inner petal -->
    <path
      d="M150 85
         C135 100 138 120 155 128
         C170 115 168 98 150 85Z"
      fill="#f48fb1"
    />

    <!-- Rose center -->
    <path
      d="M150 100
         C142 108 145 120 155 120
         C165 115 163 103 150 100Z"
      fill="#880e4f"
    />

    <!-- Small highlights -->
    <path
      d="M105 105 C110 90 120 82 130 80"
      stroke="#f8bbd0"
      stroke-width="5"
      fill="none"
      stroke-linecap="round"
      opacity="0.8"
    />

    <path
      d="M190 75 C200 85 203 95 202 105"
      stroke="#f8bbd0"
      stroke-width="4"
      fill="none"
      stroke-linecap="round"
      opacity="0.6"
    />

  </svg>

</body>
</html>
